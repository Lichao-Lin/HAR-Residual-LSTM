name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  temporal-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
